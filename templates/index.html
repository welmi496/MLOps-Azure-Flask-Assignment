<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Iris ML Service</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:0 20px;color:#14213d}form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:5px}input,button{padding:10px;border:1px solid #aab4c3;border-radius:6px}button{grid-column:1/-1;background:#0067b8;color:white;border:0;font-weight:bold}pre{background:#f3f6f9;padding:16px;border-radius:6px;min-height:40px}</style></head>
<body><h1>Iris Prediction Service</h1><p>Enter four flower measurements to classify the Iris species.</p>
<form id="form"><label>Sepal length<input name="sepal_length" value="5.1" required></label><label>Sepal width<input name="sepal_width" value="3.5" required></label><label>Petal length<input name="petal_length" value="1.4" required></label><label>Petal width<input name="petal_width" value="0.2" required></label><button>Predict</button></form><h2>Response</h2><pre id="result">Ready</pre>
<script>document.querySelector('#form').addEventListener('submit',async(e)=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));for(const k in d)d[k]=Number(d[k]);const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2);});</script></body></html>
